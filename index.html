<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEWA LUXURY</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fffaf5;color:#222}
header{background:#171717;color:white;text-align:center;padding:28px 15px}
header h1{letter-spacing:4px;margin:0 0 10px}
header p{margin:0;color:#ddd}
main{max-width:1100px;margin:auto;padding:25px 15px}
h2{text-align:center}
#status{text-align:center;padding:20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:white;border:1px solid #eee;padding:12px;border-radius:8px}
.card img{width:100%;height:250px;object-fit:cover;background:#eee}
.card h3{margin:12px 0 8px}
.price{font-weight:bold;color:#9b6b27}
footer{text-align:center;background:#171717;color:white;padding:20px;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>LEWA LUXURY</h1>
<p>Discover Our Collection — Premium fashion, selected for you.</p>
</header>
<main>
<h2>Our Collection</h2>
<div id="status">Loading products...</div>
<div class="products" id="products"></div>
</main>
<footer>LEWA LUXURY © 2026</footer>
<script>
const API = "https://lewa-shop-api.arike6648-599.workers.dev/products";

async function loadProducts() {
  const status = document.getElementById("status");
  const container = document.getElementById("products");

  try {
    const response = await fetch(API);
    if (!response.ok) throw new Error("Product service unavailable");

    const products = await response.json();
    container.innerHTML = "";

    if (!Array.isArray(products) || products.length === 0) {
      status.textContent = "No products available yet.";
      return;
    }

    products.forEach(product => {
      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.src = product.image || "";
      img.alt = product.name || "Product";
      img.onerror = () => { img.style.display = "none"; };

      const name = document.createElement("h3");
      name.textContent = product.name || "Product";

      const price = document.createElement("p");
      price.className = "price";
      price.textContent = "₦" + Number(product.price || 0).toLocaleString("en-NG");

      const description = document.createElement("p");
      description.textContent = product.description || "";

      card.append(img, name, price, description);
      container.appendChild(card);
    });

    status.textContent = "";
  } catch (error) {
    status.textContent =
      "We couldn't load products right now. Please refresh and try again.";
  }
}

loadProducts();
</script>
</body>
</html>
