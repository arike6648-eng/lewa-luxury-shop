<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEWA LUXURY | Premium Fashion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf8f4;
      color: #222;
    }
    header {
      background: #111;
      color: #d8b56d;
      padding: 25px 15px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      letter-spacing: 4px;
    }
    header p { color: white; }
    .intro {
      text-align: center;
      padding: 25px 15px 10px;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }
    .product {
      background: white;
      border: 1px solid #eee;
      padding: 12px;
      border-radius: 8px;
    }
    .product img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 5px;
    }
    .product h3 { font-size: 16px; }
    .price {
      color: #98702d;
      font-weight: bold;
    }
    .description {
      font-size: 14px;
      line-height: 1.5;
    }
    .status {
      text-align: center;
      padding: 15px;
    }
    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LEWA LUXURY</h1>
    <p>Style • Quality • Elegance</p>
  </header>

  <section class="intro">
    <h2>Discover Our Collection</h2>
    <p>Premium fashion, selected for you.</p>
  </section>

  <p class="status" id="status">Loading products...</p>
  <main class="products" id="products"></main>

  <footer>
    <p>© LEWA LUXURY</p>
    <p>Luxury you deserve
